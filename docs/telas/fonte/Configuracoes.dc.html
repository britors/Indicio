<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
  body { margin: 0; background: #FBF6EC; }
  a { color: #8A6A1F; } a:hover { color: #6F551A; }
  .tela { width: 360px; height: 800px; background: #FBF6EC; overflow: hidden;
          display: flex; flex-direction: column;
          font-family: 'Roboto','Noto Sans','Liberation Sans',system-ui,sans-serif;
          color: #2B2118; }
  .barra { height: 64px; background: #F1E7D6; display: flex; align-items: center;
           padding: 0 16px; flex-shrink: 0; }
  .barra h1 { margin: 0; font-family: 'Noto Serif','Liberation Serif',Georgia,serif;
              font-weight: 500; font-size: 24px; line-height: 32px; color: #2B2118; }
  .corpo { flex-grow: 1; padding: 24px 20px; display: flex; flex-direction: column; }
  .btn { height: 64px; border-radius: 32px; display: flex; align-items: center;
         justify-content: center; font-size: 20px; font-weight: 500; text-align: center;
         box-sizing: border-box; padding: 0 20px; }
  .btn-primario { background: #1B2A41; color: #FFFFFF; }
  .btn-secundario { background: transparent; color: #544636; border: 1px solid #8F7A5B; }
  .secao { font-family: 'Noto Serif','Liberation Serif',Georgia,serif; font-weight: 500;
           font-size: 20px; line-height: 28px; color: #1B2A41; margin: 0; }
  .apoio { font-size: 18px; line-height: 28px; color: #544636; margin: 0; }
  .texto { font-size: 20px; line-height: 30px; color: #2B2118; margin: 0; }
  </style>
</helmet>
<div class="tela">
  <div class="barra"><h1>Configurações</h1></div>
  <div class="corpo" style="gap: 20px; overflow: hidden;">
    <h2 class="secao">Tamanho do texto</h2>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px;">
        <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #1B2A41; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #1B2A41;"></div>
        </div>
        <span class="texto">Grande</span>
      </div>
      <div style="min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px;">
        <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #8F7A5B; flex-shrink: 0;"></div>
        <span class="texto">Muito grande</span>
      </div>
    </div>
    <div style="border: 1px solid #CBB99B; border-radius: 14px; background: #F1E7D6; padding: 16px;">
      <p class="texto" style="margin: 0;">Assim ficará o texto das histórias.</p>
    </div>
    <div style="height: 1px; background: #CBB99B;"></div>
    <h2 class="secao">Movimento</h2>
    <div style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="texto">Reduzir animações</span>
        <span class="apoio">As telas trocam sem transições.</span>
      </div>
      <div style="width: 52px; height: 32px; border-radius: 16px; background: #1B2A41; position: relative; flex-shrink: 0;">
        <div style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FBF6EC;"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
