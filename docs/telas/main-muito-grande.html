<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Indício — História — a carta da cena (texto muito grande)</title>
<style>

  body { margin: 0; background: #FBF6EC; }
  a { color: #8A6A1F; } a:hover { color: #6F551A; }
  .tela { width: 360px; height: 800px; background: #FBF6EC; overflow: hidden;
          display: flex; flex-direction: column;
          font-family: 'Roboto','Noto Sans','Liberation Sans',system-ui,sans-serif;
          color: #2B2118; }
  .barra { height: 64px; background: #F1E7D6; display: flex; align-items: center;
           padding: 0 16px; flex-shrink: 0; }
  .barra h1 { margin: 0; font-family: 'Noto Serif','Liberation Serif',Georgia,serif;
              font-weight: 500; font-size: 24px; line-height: 32px; color: #2B2118; }
  .corpo { flex-grow: 1; padding: 24px 20px; display: flex; flex-direction: column; }
  .btn { height: 64px; border-radius: 32px; display: flex; align-items: center;
         justify-content: center; font-size: 20px; font-weight: 500; text-align: center;
         box-sizing: border-box; padding: 0 20px; }
  .btn-primario { background: #1B2A41; color: #FFFFFF; }
  .btn-secundario { background: transparent; color: #544636; border: 1px solid #8F7A5B; }
  .secao { font-family: 'Noto Serif','Liberation Serif',Georgia,serif; font-weight: 500;
           font-size: 20px; line-height: 28px; color: #1B2A41; margin: 0; }
  .apoio { font-size: 18px; line-height: 28px; color: #544636; margin: 0; }
  .texto { font-size: 20px; line-height: 30px; color: #2B2118; margin: 0; }
  .carta { border: 3px solid #8A6A1F; border-radius: 20px; background: #FBF6EC;
           padding: 6px; box-shadow: 0 3px 10px rgba(43,33,24,0.14); }
  .carta-interna { border: 1px solid #CBB99B; border-radius: 14px; padding: 18px 16px;
                   display: flex; flex-direction: column; }
  .arte { width: 62%; align-self: center; aspect-ratio: 2 / 3; border-radius: 10px;
          border: 1px solid #CBB99B; overflow: hidden; }
  .escolha { background: #F1E7D6; border: 2px solid #8A6A1F; border-radius: 14px;
             min-height: 64px; box-sizing: border-box; padding: 14px 18px;
             display: flex; align-items: center; gap: 14px; }
  .losango { width: 12px; height: 12px; background: #8A6A1F; border-radius: 2px;
             transform: rotate(45deg); flex-shrink: 0; }
  
</style>
</head>
<body>
<div class="tela" style="--corpo: 1.25; --titulo: 1.125;">
  <div class="barra"><h1 style="font-size: calc(24px * var(--titulo));">O Mistério da Taça Desaparecida</h1></div>
  <div class="corpo" style="padding: 24px 20px; overflow: hidden;">
    <div class="carta">
      <div class="carta-interna">
        <div class="arte"><svg viewBox="0 0 400 600" style="width: 100%; height: 100%; display: block;" aria-hidden="true">
  <path fill="#E6D8BE" d="M0,0h400v600h-400z"/>
  <path fill="#EFE3CD" d="M0,0h400v300h-400z"/>
  <path fill="#C6AF8C" d="M0,470h400v130h-400z"/>
  <path fill="#A98F6B" d="M0,460h400v12h-400z"/>
  <path fill="#B49A76" fill-opacity="0.8" d="M112,506 L196,498 L206,548 L122,556 Z"/>
  <path fill="#7A5A3A" d="M180,460 h72 v78 h-72 z"/>
  <path fill="#9C7A50" d="M170,448 h92 v14 h-92 z"/>
  <path fill="#C3D7E0" fill-opacity="0.45" d="M182,240 h68 v208 h-68 z"/>
  <path fill="none" stroke="#8A6A1F" stroke-width="4" d="M182,240 h68 v208 h-68 z"/>
  <path fill="#8A6A1F" d="M174,228 h84 v14 h-84 z"/>
  <path fill="none" stroke="#F8F1DE" stroke-width="4" stroke-opacity="0.85" d="M196,256 L196,432"/>
</svg></div>
        <p class="texto" style="margin: 20px 0 0; font-size: calc(20px * var(--corpo)); line-height: calc(30px * var(--corpo));">A vitrine está intacta. O pedestal, porém, não está centralizado.</p>
        <div class="btn btn-secundario" style="margin-top: 20px; font-size: calc(20px * var(--titulo));">Ouvir o trecho</div>
      </div>
    </div>
    <h2 class="secao" style="margin-top: 32px; font-size: calc(20px * var(--titulo));">Escolha a próxima carta</h2>
    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 14px;">
      <div class="escolha"><div class="losango"></div><span style="font-size: calc(20px * var(--titulo)); font-weight: 500;">Examinar o chão em volta do pedestal</span></div>
      <div class="escolha"><div class="losango"></div><span style="font-size: calc(20px * var(--titulo)); font-weight: 500;">Olhar para o forro, acima da vitrine</span></div>
    </div>
  </div>
</div>
</body>
</html>
